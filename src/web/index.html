<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receptor de documentos de WhatsApp</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="cabecera">
      <h1>Receptor de documentos de WhatsApp</h1>
      <span id="estado" class="estado bad">Desconectado</span>
    </div>
    <div class="cabe-info">
      <span id="ultimo-mensaje"></span>
      <span id="version-app" class="version"></span>
      <button id="btn-qr" type="button">Escanear QR</button>
      <button id="btn-limpiar" type="button">Limpiar</button>
      <button id="btn-notif" type="button" hidden>Activar notificaciones</button>
      <button id="btn-logs" type="button">Logs</button>
    </div>
  </header>

  <main>
    <section id="qr-panel" hidden>
      <p>Escanea este código con tu teléfono: <strong>WhatsApp → Ajustes → Dispositivos vinculados → Vincular dispositivo</strong>.</p>
      <img id="qr-img" alt="Código QR de WhatsApp">
      <p id="qr-msg" class="aviso"></p>
    </section>

    <section class="barra">
      <label for="impresora">Impresora:</label>
      <select id="impresora">
        <option value="">(Por defecto — impresora del sistema)</option>
      </select>
      <button id="btn-impresora" type="button">Guardar</button>
      <span id="impresoras-aviso" class="aviso"></span>
      <label for="filtro-tipo">Tipo:</label>
      <select id="filtro-tipo">
        <option value="todos">Todos</option>
        <option value="pdf">Solo PDF</option>
        <option value="imagen">Imágenes</option>
        <option value="otros">Otros</option>
      </select>
      <button id="btn-orden" type="button">Antiguos primero</button>
      <button id="btn-actualizar" type="button">Actualizar</button>
    </section>

    <div id="toast" hidden></div>

    <div class="zona-doble">
      <div class="col-lista">
        <div class="tabla-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha y hora</th>
                <th>Origen</th>
                <th>Remitente</th>
                <th>Nombre de archivo</th>
                <th>Tamaño</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="filas"></tbody>
          </table>
        </div>

        <div class="paginador">
          <button id="btn-prev" type="button">‹ Anterior</button>
          <span id="pagina-info"></span>
          <button id="btn-next" type="button">Siguiente ›</button>
        </div>
      </div>

      <section id="contexto-panel" hidden>
        <div class="panel-cab">
          <span id="contexto-titulo"></span>
          <button id="contexto-cerrar" type="button">✕</button>
        </div>
        <div id="contexto-msgs"></div>
      </section>
    </div>

    <div id="preview-panel" hidden>
      <div class="panel-cab">
        <span id="preview-titulo"></span>
        <button id="preview-imprimir" type="button">Imprimir</button>
        <button id="preview-cerrar" type="button">✕</button>
      </div>
      <div id="preview-contenido"></div>
    </div>

    <div id="logs-panel" hidden>
      <div class="panel-cab">
        <span id="logs-titulo">Registro de diagnóstico</span>
        <button id="logs-cerrar" type="button">✕</button>
      </div>
      <pre id="logs-contenido"></pre>
    </div>

    <p id="mensaje" class="mensaje"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
